<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
      IoT Monitor · Đăng nhập
    </title>
    <link rel="stylesheet" href="screen.css">
  </head>
  <body class="login-page">
    <aside class="login-brand">
      <a href="index.html">
        IOT LAB
      </a>
      <div>
        <h2>
          Theo dõi môi trường
          <br>
          thông minh.
        </h2>
        <p>
          Nhiệt độ · Độ ẩm · Ánh sáng · Thiết bị
        </p>
      </div>
      <div class="login-orbit" aria-hidden="true">
        <i>
        </i>
      </div>
    </aside>
    <main class="login-form-area">
      <section class="login-card">
        <h1>
          Đăng nhập
        </h1>
        <p class="muted">
          Truy cập hệ thống giám sát IoT
        </p>
        <label class="field">
          Email
          <input type="email" placeholder="student@iotlab.vn" autocomplete="username">
        </label>
        <label class="field">
          Mật khẩu
          <input type="password" placeholder="Nhập mật khẩu" autocomplete="current-password">
        </label>
        <p class="hint">
          Màn hình mẫu HTML/CSS, chưa xác thực tài khoản.
        </p>
        <a class="primary login-submit" href="index.html">
          Xem Dashboard mẫu
        </a>
      </section>
    </main>
  </body>
</html>
