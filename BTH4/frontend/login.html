<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Monitor · Đăng nhập</title>
    <link rel="stylesheet" href="css/screen.css?v=20261105-2">
    <script src="js/login.js" defer></script>
  </head>
  <body class="login-page">
    <aside class="login-brand">
      <a href="index.html">IOT LAB</a>
      <div>
        <h2>Theo dõi môi trường<br>thông minh.</h2>
        <p>Nhiệt độ · Độ ẩm · Ánh sáng · Thiết bị</p>
      </div>
      <div class="login-orbit" aria-hidden="true"><i></i></div>
    </aside>
    <main class="login-form-area">
      <section class="login-card">
        <h1>Đăng nhập</h1>
        <p class="muted">Truy cập hệ thống giám sát IoT</p>
        <form class="login-form" id="login-form">
          <label class="field">
            Tài khoản hoặc email
            <input type="text" name="identifier" placeholder="Tên tài khoản hoặc email" autocomplete="username" required>
          </label>
          <label class="field">
            Mật khẩu
            <input type="password" name="password" placeholder="Nhập mật khẩu" autocomplete="current-password" required>
          </label>
          <p class="form-error" role="alert" aria-live="polite" hidden></p>
          <button class="primary login-submit" type="submit">Đăng nhập</button>
        </form>
      </section>
    </main>
  </body>
</html>
